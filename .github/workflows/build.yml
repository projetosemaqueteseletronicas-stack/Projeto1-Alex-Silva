name: Criar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build com Buildozer
      uses: kooritea/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .

    - name: Upload do APK
      uses: actions/upload-artifact@v4
      with:
        name: Meu-Aplicativo-APK
        path: bin/*.apk
