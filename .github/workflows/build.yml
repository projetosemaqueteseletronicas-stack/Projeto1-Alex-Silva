name: Criar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependências do Sistema Linux
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache git libffi-dev libssl-dev libtinfo5

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Compilar APK com Buildozer
      run: |
        yes | buildozer android debug

    - name: Enviar o APK pronto para download
      uses: actions/upload-artifact@v4
      with:
        name: Meu-Aplicativo-APK
        path: bin/*.apk
