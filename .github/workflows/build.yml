name: Pipeline de Compilacao Oficial Kivy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositorio
      uses: actions/checkout@v4

    - name: Validacao e Higienizacao do Arquivo Spec
      run: |
        python3 -c "
        with open('buildozer.spec', 'r') as f:
            linhas = f.readlines()
        
        chaves_remover = ['android.sdk', 'android.ndk', 'android.ndk_path', 'android.sdk_path']
        linhas_filtradas = [l for l in linhas if not any(l.strip().startswith(k) and '=' in l for k in chaves_remover)]
        
        with open('buildozer.spec', 'w') as f:
            f.writelines(linhas_filtradas)
        "

    - name: Execucao do Build via Docker Oficial Kivy
      uses: kivy/buildozer-action@v1
      with:
        command: buildozer android debug

    - name: Armazenamento do Artefato APK Final
      uses: actions/upload-artifact@v4
      with:
        name: pacote-android-estavel
        path: bin/*.apk
